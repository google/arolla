// Protobuf messages for arolla dense_array serialization.

edition = "2023";

package arolla.serialization_codecs;

import "arolla/serialization_base/base.proto";

option features.utf8_validation = NONE;

// Serialization format for arolla::DecisionForest.
// See fields description in
//     decision_forest/decision_forest.h
//     decision_forest/split_conditions/*
// All fields have one-to-one correspondence.
message DecisionForestV1Proto {
  extend arolla.serialization_base.ValueProto {
    DecisionForestV1Proto extension = 412259944;
  }

  message IntervalSplitCondition {
    int32 input_id = 1;
    float left = 2;
    float right = 3;
  }

  message SetOfValuesSplitConditionInt64 {
    int32 input_id = 1;
    repeated int64 values = 2;
    bool result_if_missed = 3;
  }

  message NodeId {
    oneof node_id {
      int32 split_node_id = 1;
      int32 adjustment_id = 2;
    }
  }

  message SplitNode {
    NodeId child_if_false = 1;
    NodeId child_if_true = 2;

    oneof condition {
      IntervalSplitCondition interval_condition = 3;
      SetOfValuesSplitConditionInt64 set_of_values_int64_condition = 4;
    }
  }

  message DecisionTree {
    repeated SplitNode split_nodes = 1;
    repeated float adjustments = 2;
    float weight = 3;
    int32 step = 4;
    int32 submodel_id = 5;
  }

  message DecisionForest {
    repeated DecisionTree trees = 1;
  }

  // input_value_indices[0]
  //   -- DecisionForest
  // input_expr_indices[0]
  //   -- Postprocessing expression.
  // input_expr_indices[1:1+oob_filter_count]
  //   -- OOB filters
  // input_expr_indices[1+oob_filter_count:]
  //   -- Preprocessing expressions.
  message ForestModel {
    message SubmodelGroup {
      string name = 1;

      repeated int32 submodel_ids = 2;
    }

    message Arg {
      string name = 1;

      bool has_preprocessing = 2 [default = false];
    }

    repeated Arg args = 1;
    repeated SubmodelGroup submodel_groups = 2;

    // If `truncation_step` is present, then all trees with
    // `step > truncation_step` are ignored during evaluation.
    // Note that in serialization we don't automatically remove
    // the unused trees from the DecisionForest. One DecisionForest can
    // potentially be used in several ForestModel with different truncation
    // steps.
    int32 truncation_step = 3;
    int32 oob_filter_count = 4 [default = 0];
  }

  message TreeFilter {
    int32 step_range_from = 1;
    int32 step_range_to = 2 [default = -1];  // -1 means unlimited.
    // Empty means "all submodels".
    repeated int32 submodels = 3;
  }

  // input_value_indices[0]
  //   -- DecisionForest
  message DecisionForestOperator {
    repeated TreeFilter tree_filters = 1;
    // Must contain all inputs used by the forest. Can additionally include
    // inputs that are not used by the forest, but affect scalar/batched
    // evaluation dispatch.
    repeated int32 required_input_ids = 2;
  }

  oneof value {
    DecisionForest forest = 1;
    ForestModel forest_model = 2;
    DecisionForestOperator decision_forest_operator = 3;
    bool forest_qtype = 101;
  }
}
